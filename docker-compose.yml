# 一键启动：docker compose up -d，然后在浏览器打开 http://服务器IP:5080
# 对公网开放时，请在前面加 HTTPS 反向代理（Nginx、Caddy 等），不需要其他配置。
# 默认使用 Docker Hub 上发布好的镜像；想从源代码自己构建时，运行 docker compose up -d --build。
services:
  cubemanage:
    image: digitalvirt/cubemanage:latest
    build: .
    pull_policy: missing
    container_name: cubemanage
    restart: unless-stopped
    ports:
      - "5080:5080"
    environment:
      CUBE_BODY_ENCODING: form
