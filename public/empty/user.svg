<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
.float{animation:f 4.2s ease-in-out infinite}
.drift{animation:f 4.2s ease-in-out -1.4s infinite}
@keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.8px)}}
.shadow{transform-box:fill-box;transform-origin:center;animation:sh 4.2s ease-in-out infinite}
@keyframes sh{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.75;transform:scale(.95)}}
.lit{animation:g 2.6s ease-in-out infinite}.lit.d2{animation-delay:-.9s}.lit.d3{animation-delay:-1.8s}
@keyframes g{0%,100%{opacity:1}50%{opacity:.5}}
.bounce{animation:b 2.4s cubic-bezier(.45,0,.55,1) infinite}
@keyframes b{0%,100%{transform:translateY(0)}45%{transform:translateY(-3.2px)}}
.pinshadow{transform-box:fill-box;transform-origin:center;animation:ps 2.4s cubic-bezier(.45,0,.55,1) infinite}
@keyframes ps{0%,100%{transform:scale(1);opacity:1}45%{transform:scale(.8);opacity:.6}}
.layer{animation:f 3.6s ease-in-out infinite}.l2{animation-delay:-.3s}.l3{animation-delay:-.6s}
.l1{animation:none}
.sheen{animation:sn 3s ease-in-out infinite}
@keyframes sn{0%,100%{opacity:1}50%{opacity:.25}}
.lid{animation:lid 3.2s ease-in-out infinite}
@keyframes lid{0%,60%,100%{transform:translateY(0)}75%{transform:translateY(-3px)}85%{transform:translateY(-3px)}}
.scan{animation:sc 4s ease-in-out infinite}
@keyframes sc{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,1.5px)}50%{transform:translate(-5px,-1px)}75%{transform:translate(-2px,-2px)}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:gr 3.4s ease-in-out infinite}
@keyframes gr{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.82)}}
.flow{animation:fl 1.4s linear infinite}
@keyframes fl{to{stroke-dashoffset:-10}}
.pulse{animation:f 2.4s ease-in-out infinite}
.flap{transform-box:fill-box;animation:fp 3.6s ease-in-out infinite}.fl{transform-origin:50% 0}.fr{transform-origin:0 50%;animation-delay:-1.2s}
@keyframes fp{0%,100%{transform:rotate(0)}50%{transform:rotate(-2.5deg)}}
.badge{transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.34,1.56,.64,1) .2s both}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs>
<linearGradient id="gt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#F2F5FA"/></linearGradient>
<linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#E6EBF2"/><stop offset="1" stop-color="#D3DCE8"/></linearGradient>
<linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#C9D3E1"/><stop offset="1" stop-color="#AEBDD2"/></linearGradient>
<linearGradient id="gs" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#49658F" stop-opacity=".28"/><stop offset="1" stop-color="#9BADC9" stop-opacity=".04"/></linearGradient>
<linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5AA6FF"/><stop offset="1" stop-color="#006EFF"/></linearGradient>
<linearGradient id="gbl" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7DB8FF"/><stop offset="1" stop-color="#3D8BF5"/></linearGradient>
<linearGradient id="gbr" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3D8BF5"/><stop offset="1" stop-color="#1C6FE6"/></linearGradient>
<linearGradient id="gh" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9BADC9"/><stop offset="1" stop-color="#49658F"/></linearGradient>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/><feColorMatrix values="0 0 0 0 .2 0 0 0 0 .5 0 0 0 0 1 0 0 0 .55 0"/><feBlend in="SourceGraphic"/></filter>
<filter id="soft" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="1.4"/></filter>
</defs><g transform="translate(-8.93 -8.10) scale(1.124)"><g class="ground"><g class="shadow" filter="url(#soft)"><path d="M48 34L80.04 52.5L48 71L15.96 52.5Z" fill="url(#gs)"/></g><path d="M22.02 51L48 66L48 63.4L22.02 48.4Z" fill="url(#gl)" stroke="#9BADC9" stroke-opacity=".55" stroke-width=".5" stroke-linejoin="round"/><path d="M73.98 51L48 66L48 63.4L73.98 48.4Z" fill="url(#gr)" stroke="#9BADC9" stroke-opacity=".55" stroke-width=".5" stroke-linejoin="round"/><path d="M48 33.4L73.98 48.4L48 63.4L22.02 48.4Z" fill="url(#gt)" stroke="#9BADC9" stroke-opacity=".55" stroke-width=".5" stroke-linejoin="round"/><path d="M22.02 48.4L48 63.4L73.98 48.4" stroke="#fff" stroke-width=".8" stroke-linejoin="round" fill="none"/><ellipse cx="48" cy="48.4" rx="10.5" ry="5" fill="#49658F" fill-opacity=".18"/></g><g class="object"><g class="float"><path d="M37 48.4a11 10 0 0 1 22 0c0 1.4-4.9 2.6-11 2.6S37 49.8 37 48.4Z" fill="url(#gt)" stroke="#9BADC9" stroke-width=".9"/><circle cx="48" cy="31.9" r="6.6" fill="url(#gt)" stroke="#9BADC9" stroke-width=".9"/><path d="M44.4 28.799999999999997a4.2 4.2 0 0 1 3-2.2" stroke="#fff" stroke-width="1.1" stroke-linecap="round" fill="none"/><g class="lit" filter="url(#glow)"><path d="M44.4 42.6l3.6 3.8 3.6-3.8" stroke="#559EFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g></g></g><g transform="translate(-3.00 -12.33)"><g class="badge"><circle cx="77" cy="77" r="9.5" fill="#fff"/><circle cx="77" cy="77" r="8" fill="#006EFF"/><rect x="76.1" y="72.6" width="1.8" height="8.8" rx=".9" fill="#fff"/><rect x="72.6" y="76.1" width="8.8" height="1.8" rx=".9" fill="#fff"/></g></g></svg>