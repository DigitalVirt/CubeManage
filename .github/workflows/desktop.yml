# 自动打包桌面客户端：
# - 推送 v 开头的标签（如 v0.1.69）时，分别在 macOS 和 Windows 上打包，并把安装包发布到 GitHub Releases；
# - 也可以在 Actions 页面手动运行：默认只生成安装包（在本次运行的 Artifacts 里下载）；
#   勾选“发布 Release”后，按 package.json 的版本号创建 v 标签和 Release。
# Release 正文取自 .github/release-notes/v<版本号>.md，没有这个文件时用 GitHub 自动生成的更新说明。
# 签名是可选的：在仓库 Settings → Secrets 里配置下面这些值后自动签名，不配置则生成未签名的安装包。
#   macOS：CSC_LINK（Developer ID 证书 .p12 的 base64）、CSC_KEY_PASSWORD、APPLE_ID、APPLE_APP_SPECIFIC_PASSWORD、APPLE_TEAM_ID（公证用）
#   Windows：WIN_CSC_LINK（代码签名证书 .pfx 的 base64）、WIN_CSC_KEY_PASSWORD
name: Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 发布 Release（按 package.json 的版本号创建标签）
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 锁文件补全 Electron 依赖之前先不锁定版本安装；本地运行 pnpm install 并提交 pnpm-lock.yaml 后，可改回 --frozen-lockfile
      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      - name: 测试
        run: pnpm test

      - name: 构建页面
        run: pnpm build

      - name: 打包（macOS）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # 未配置签名证书时，空的环境变量会被当成证书路径，先清掉
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -z "${!v}" ] && unset "$v"
          done
          pnpm exec electron-builder --mac --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # 没有配置证书时不去钥匙串里找，直接生成未签名的安装包
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}

      - name: 打包（Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD; do
            [ -z "${!v}" ] && unset "$v"
          done
          pnpm exec electron-builder --win --publish never
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: CubeManage-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号
        id: meta
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          notes=".github/release-notes/v$v.md"
          [ -f "$notes" ] && echo "notes=$notes" >> "$GITHUB_OUTPUT" || true

      - name: 下载安装包
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: CubeManage ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.meta.outputs.tag }}
          body_path: ${{ steps.meta.outputs.notes }}
          generate_release_notes: ${{ steps.meta.outputs.notes == '' }}
          files: |
            dist-release/*.dmg
            dist-release/*.exe
          draft: false
